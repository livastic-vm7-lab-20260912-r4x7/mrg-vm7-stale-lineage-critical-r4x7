merge_queue:
  mode: parallel
  max_parallel_checks: 2
  skip_intermediate_results: true

scopes:
  source:
    files:
      vm7-chain:
        include:
          - VM7_PARENT.md
          - VM7_CHILD.md

queue_rules:
  - name: default
    merge_method: merge
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/queue-hold

pull_request_rules:
  - name: queue controlled pull requests
    conditions:
      - base = main
    actions:
      queue:
        name: default

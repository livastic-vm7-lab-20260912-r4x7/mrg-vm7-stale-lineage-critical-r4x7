name: Queue Hold

on:
  pull_request:

jobs:
  queue-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stale-lineage provenance oracle
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'VM7_STALE_H1_FAIL_20260913' VM7_PARENT.md 2>/dev/null || grep -q 'VM7_STALE_H1_FAIL_20260913' VM7_CHILD.md 2>/dev/null; then
            echo 'VM7_STALE_LINEAGE_FAIL=1'
            exit 1
          fi
          echo 'VM7_STALE_LINEAGE_OK=1'
